<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work</title>
    <link rel="stylesheet" href="/Css/General/navigation.css">
    <link rel="stylesheet" href="/Css/General/fonts.css">
    <link rel="stylesheet" href="/Css/General/cards.css">
    <link rel="stylesheet" href="/Css/General/buttons.css">
    <link rel="stylesheet" href="/Css/projects.css">
    <script src="/JS/navigation.js" defer></script>
    <script type="module" src="/JS/projects.js"></script>
</head>
<body>

    <div id="navigation-container"></div>

    <main>
        <section class="hero">
            <h1>Projects</h1>
            <button class="button" id="project-button">Project Table</button>
        </section>

            <section class="body-cards">
                <div class="current">
                    <h2>Current</h2>

                    <div class="grid-wrapper">
                        <button class="grid-button left-button" id="left-button-current">◀</button>
                        
                        <div class="current-grid card-grid">
                            <div class="project-card" id="current-card1"></div>
                            <div class="project-card" id="current-card2"></div>
                            <div class="project-card" id="current-card3"></div>
                        </div>

                        <button class="grid-button right-button" id="right-button-current">▶</button>
                    </div>
                </div>
                
                <div class="previous">
                    <h2>Previous</h2>

                    <div class="grid-wrapper">
                        <button class="grid-button left-button" id="left-button-previous">◀</button>

                        <div class="previous-grid card-grid">
                            <div class="project-card" id="previous-card1"></div>
                            <div class="project-card" id="previous-card2"></div>
                            <div class="project-card" id="previous-card3"></div>
                        </div>

                        <button class="grid-button right-button" id="right-button-previous">▶</button>
                    </div>

                </div>
            </section>
    </main>  
    
    <footer>
        This is the footer of the website
        <time datetime="2026-02-12">12 February 2026</time>
    </footer>
</body>
</html>
