<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Table</title>
    <link rel="stylesheet" href="../Css/General/navigation.css">
    <link rel="stylesheet" href="../Css/General/fonts.css">
    <link rel="stylesheet" href="../Css/General/buttons.css">
    <link rel="stylesheet" href="../Css/General/footer.css">
    <link rel="stylesheet" href="../Css/projecttable.css">
    <script src="../JS/General/navigation.js" defer></script>
    <script src="../JS/General/footer.js" defer></script>
    <script type="module" src="../JS/projecttable.js"></script>
</head>
<body>

    <div id="navigation-container"></div>
    
    <main>
        <section class="hero">
            <h1>Project Table</h1>
        </section>
        <section class="tableSearch">
            <form role="search">
                <label for="table-search">Search the table:</label>
                <input type="search" id="table-search" name="q" placeholder="Search Table...">
            </form>
        </section>
        <section class="projects-table">
            <table id="table">
                <tbody>
                    <tr>
                        <th class="body-text sort-click" id="sort-name">Project Name</th>
                        <th class="body-text sort-click" id="sort-description">Project Description</th>
                        <th class="body-text sort-click" id="sort-status">Project Status</th>
                        <th class="body-text sort-click" id="sort-date">Project Date</th>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>
    <div id="contact-container"></div>
</body>
</html>
